<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KELYROX motion banner</title><desc id="desc">Animated digital studio banner with orbiting lights and scan lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#070A12"/><stop offset=".48" stop-color="#0D1830"/><stop offset="1" stop-color="#071312"/><animate attributeName="x1" values="0;240;0" dur="9s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(640 210) rotate(90) scale(250 440)" gradientUnits="userSpaceOnUse"><stop stop-color="#58A6FF" stop-opacity=".25"/><stop offset=".55" stop-color="#35E3BA" stop-opacity=".08"/><stop offset="1" stop-color="#070A12" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="150" y1="200" x2="1130" y2="200" gradientUnits="userSpaceOnUse"><stop stop-color="#58A6FF" stop-opacity="0"/><stop offset=".3" stop-color="#58A6FF"/><stop offset=".7" stop-color="#42F5C5"/><stop offset="1" stop-color="#42F5C5" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#9FC4FF" stroke-opacity=".08"/></pattern>
    <clipPath id="reveal"><rect width="0" height="420"><animate attributeName="width" values="0;1280;1280" dur="2.2s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="1280" height="420" rx="26" fill="url(#bg)"/><rect width="1280" height="420" rx="26" fill="url(#grid)"/><rect width="1280" height="420" rx="26" fill="url(#halo)"/>
  <g clip-path="url(#reveal)">
    <g opacity=".55" stroke="url(#line)"><ellipse cx="640" cy="210" rx="424" ry="136" stroke-width="1.25"><animateTransform attributeName="transform" type="rotate" from="0 640 210" to="360 640 210" dur="22s" repeatCount="indefinite"/></ellipse><ellipse cx="640" cy="210" rx="330" ry="102" stroke-width="1" stroke-dasharray="8 12"><animateTransform attributeName="transform" type="rotate" from="360 640 210" to="0 640 210" dur="15s" repeatCount="indefinite"/></ellipse><path d="M120 210H1160" stroke-width="1" stroke-dasharray="4 16"><animate attributeName="stroke-dashoffset" values="0;-160" dur="4s" repeatCount="indefinite"/></path></g>
    <g filter="url(#glow)"><circle cx="216" cy="210" r="5" fill="#58A6FF"><animateTransform attributeName="transform" type="rotate" from="0 640 210" to="360 640 210" dur="22s" repeatCount="indefinite"/></circle><circle cx="970" cy="210" r="4" fill="#42F5C5"><animateTransform attributeName="transform" type="rotate" from="0 640 210" to="360 640 210" dur="22s" repeatCount="indefinite"/></circle><circle cx="310" cy="210" r="3" fill="#B4D4FF"><animateTransform attributeName="transform" type="rotate" from="360 640 210" to="0 640 210" dur="15s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(640 210)" text-anchor="middle"><text y="-4" fill="#F5F9FF" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="15">KELYROX</text><text y="34" fill="#8CA7C8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="6">DIGITAL SYSTEMS / MOTION / AI</text><path d="M-232 55H232" stroke="url(#line)" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 464;464 0;464 0" dur="3.5s" repeatCount="indefinite"/></path></g>
    <rect x="-180" y="0" width="160" height="420" fill="#8ED1FF" fill-opacity=".12" transform="skewX(-18)"><animateTransform attributeName="transform" type="translate" values="-1200 0;1700 0" dur="5.6s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#9EB4CE" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2"><text x="48" y="50">KELYROX // 01</text><text x="1093" y="370">BUILD / EVOLVE</text></g><path d="M48 64H170" stroke="#58A6FF" stroke-opacity=".7"/>
</svg>
